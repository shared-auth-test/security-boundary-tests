# Standalone loopback acceptance fixture; nginx must include auth_request.
# Verifier :9081 is a dedicated realm/audience Shared Auth server with its DB.
pid /tmp/shared-auth-nginx.pid;
error_log stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 127.0.0.1:9080;
        location = /_shared_auth_check {
            internal;
            proxy_pass http://127.0.0.1:9081/auth/verify;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 200ms;
            proxy_read_timeout 1s;
            proxy_next_upstream off;
            proxy_cache off;
        }
        location / {
            auth_request /_shared_auth_check;
            proxy_pass http://127.0.0.1:9082;
            proxy_pass_request_headers off;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Encoding $http_content_encoding;
            proxy_set_header Accept $http_accept;
            proxy_next_upstream off;
        }
    }
}
