name: Canonical client API contract

on:
  pull_request:
    paths:
      - "schemas/client-api.schema.json"
      - "clients/client-api.tsp"
      - "clients/**"
      - "scripts/client_contract_boundary.py"
      - "scripts/harden_client_contract.py"
      - "scripts/verify_client_contract.py"
      - "tests/test_client_contract_boundary.py"
      - ".zpkg.toml"
      - ".github/workflows/client-api-contract.yml"
  push:
    branches: [main]
    paths:
      - "schemas/client-api.schema.json"
      - "clients/client-api.tsp"
      - "clients/**"
      - "scripts/client_contract_boundary.py"
      - "scripts/harden_client_contract.py"
      - "scripts/verify_client_contract.py"
      - "tests/test_client_contract_boundary.py"
      - ".zpkg.toml"
      - ".github/workflows/client-api-contract.yml"

permissions:
  contents: read

concurrency:
  group: client-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require both authored peer lanes
        run: |
          test -f clients/client-api.schema.json
          test -f clients/client-api.tsp
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Draft 2020-12 validator
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3 referencing==0.36.2 rpds-py==0.27.0
      - name: Validate schema, instance, private boundary, and fingerprints
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/client-api.schema.json")
          if not schema_path.is_file():
              schema_path = Path("clients/client-api.schema.json")
          surface_path = Path("clients/api-surface.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          surface = json.loads(surface_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(surface),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              first = errors[0]
              location = "/".join(map(str, first.absolute_path)) or "<root>"
              raise SystemExit(f"{location}: {first.message}")
          print("Draft 2020-12 client API surface validated")
          PY
          python3 -m unittest -v tests.test_client_contract_boundary
          if [ -f scripts/verify_client_contract.py ]; then
            python3 scripts/verify_client_contract.py
          fi
