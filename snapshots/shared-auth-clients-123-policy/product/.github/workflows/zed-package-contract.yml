name: Zed package contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-package-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check-package-contract.py

  typescript-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Build and test the native TypeScript package
        working-directory: clients/ts
        run: |
          test -f package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --if-present
          npm test --if-present
      - name: Import under Node, Deno, and Bun
        run: |
          node test/runtime-import-smoke.mjs
          deno run --allow-read test/runtime-import-smoke.mjs
          bun run test/runtime-import-smoke.mjs
      - run: node test/run-edge-smoke.mjs
