name: ORES platform exact-head canary

on:
  pull_request:
    paths:
      - .github/workflows/ores-platform-canary.yml
      - scripts/verify_ores_foundations.py
      - scripts/run_ores_foundation_native.sh
      - scripts/prepare_shared_auth_candidate.sh
      - scripts/test_shared_auth_candidate.sh
      - scripts/test_sops_policy.sh
      - docs/ores-platform-canary.md
  push:
    branches: [main]
    paths:
      - .github/workflows/ores-platform-canary.yml
      - scripts/verify_ores_foundations.py
      - scripts/run_ores_foundation_native.sh
      - scripts/prepare_shared_auth_candidate.sh
      - scripts/test_shared_auth_candidate.sh
      - scripts/test_sops_policy.sh
      - docs/ores-platform-canary.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_INTERFACES_SHA: 289f66434d919d77e57818292e127f7dcb137525
  ORES_LIB_CORE_SHA: 8f3299409ee33c55fdbb2d2e64630a5e0b72f6fc
  ORES_LOGGER_SHA: b87ac48333e606dbe93dbecf55b04a7882b4605c
  SHARED_AUTH_SHA: 76b19ddce5510430db0b73288120d1897f6f84c6
  SHARED_AUTH_SOPS_SHA: e6e1c2ed2153c88f7fd3cc2a50909760f649b865
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  foundations:
    name: ORES contracts / core / logger
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out test policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out ores-interfaces at the certified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-interfaces
          ref: 289f66434d919d77e57818292e127f7dcb137525
          path: fixtures/ores-interfaces
          persist-credentials: false
          fetch-depth: 1

      - name: Check out ores-lib-core at the certified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-lib-core
          ref: 8f3299409ee33c55fdbb2d2e64630a5e0b72f6fc
          path: fixtures/ores-lib-core
          persist-credentials: false
          fetch-depth: 1

      - name: Check out ores.otel.log at the certified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores.otel.log
          ref: b87ac48333e606dbe93dbecf55b04a7882b4605c
          path: fixtures/ores.otel.log
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Verify exact heads, provenance, seven language targets, and logger consumers
        run: bash scripts/run_ores_foundation_native.sh

  shared-auth:
    name: Shared Auth ORES integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out test policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out Shared Auth at the exact proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shared-auth/shared-auth-server.rs
          ref: 76b19ddce5510430db0b73288120d1897f6f84c6
          path: shared-auth-server
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Resolve the exact dependency graph and run policy checks
        run: bash scripts/prepare_shared_auth_candidate.sh

      - name: Upload the exact generated Shared Auth lock for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-auth-cargo-lock-${{ env.SHARED_AUTH_SHA }}
          path: shared-auth-server/Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Format, compile, test, lint, and re-run policy
        run: bash scripts/test_shared_auth_candidate.sh

  sops-policy:
    name: SOPS / Just / Nix structural policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out test policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out the exact SOPS lifecycle proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shared-auth/shared-auth-server.rs
          ref: e6e1c2ed2153c88f7fd3cc2a50909760f649b865
          path: shared-auth-sops
          persist-credentials: false
          fetch-depth: 1

      - name: Verify ciphertext-only SOPS Just Nix policy without decrypting
        run: bash scripts/test_sops_policy.sh
