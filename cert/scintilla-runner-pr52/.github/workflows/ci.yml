name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(build/|\.direnv/|\.env$|node_modules/|erl_crash\.dump$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          gleam-version: "1.17.0"
      - run: gleam format --check src test

  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: make -C tools/flags-2-env all
      - run: tools/flags-2-env/build/flags2env audit .cli-flags.toml

  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          gleam-version: "1.17.0"
      - name: Compile Erlang execution module
        run: |
          mkdir -p /tmp/scintilla-erlc
          erlc -o /tmp/scintilla-erlc src/lambda_child_runner.erl
          cat >/tmp/dd_cli_config_client_ffi.erl <<'ERLANG'
          -module(dd_cli_config_client_ffi).
          -export([getenv/2]).
          getenv(_Name, Default) -> Default.
          ERLANG
          erlc -o /tmp/scintilla-erlc /tmp/dd_cli_config_client_ffi.erl
      - name: Exercise function-specific provisioned pool semantics
        run: |
          erl -noshell -pa /tmp/scintilla-erlc -eval '
            {ok, <<"function:fn-1:default">>, Max} =
              lambda_child_runner:worker_pool_for_test(
                <<"fn-1">>,
                <<"{\"metaData\":{\"runtimeConfig\":{\"provisionedConcurrency\":25}}}">>,
                <<"nodejs">>,
                false
              ),
            true = Max >= 25,
            {ok, <<"function:fn-2:session">>, 1} =
              lambda_child_runner:worker_pool_for_test(
                <<"fn-2">>,
                <<"{\"reuseKey\":\"session\",\"provisionedConcurrency\":5}">>,
                <<"nodejs">>,
                false
              ),
            halt().'
      - run: node --test test/*.test.mjs
