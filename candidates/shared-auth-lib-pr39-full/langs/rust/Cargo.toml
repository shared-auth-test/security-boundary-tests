[package]
name = "shared-auth-lib"
version = "0.1.0"
edition = "2021"
description = "Auth guard for Rust services: verify a caller, race shared-auth against Supabase, and return limited HTML when unauthenticated."
license = "UNLICENSED"
publish = false

[dependencies]
shared-auth-interfaces = { path = "../../vendor/shared-auth-interfaces/rust" }

jsonwebtoken = "10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
maud = "0.27"
axum = { version = "0.7", features = ["macros"] }
http = "1"
tracing = "0.1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pem", "pkcs8"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rsa = { version = "0.9", features = ["pem"] }
