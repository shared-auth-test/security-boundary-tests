name: ORES trace marker contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-trace-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ores-trace-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),p=require('path'),ext=new Set(['.js','.jsx','.ts','.tsx','.mjs','.cjs']),bad=[];
          for(const f of cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(f=>f&&ext.has(p.extname(f))&&!/(^|\/)(node_modules|dist|build|coverage|vendor|generated)(\/|$)/.test(f))){fs.readFileSync(f,'utf8').split(/\r?\n/).forEach((l,i)=>{if(l.includes('dd-trace-'))bad.push(`${f}:${i+1}: use ores-trace-*`);const m=l.match(/\.(addTrace(?:Id)?)\(\s*(['"`])([^'"`]+)\2/);if(m&&!/^ores-trace-[A-Za-z0-9_-]{12,64}$/.test(m[3]))bad.push(`${f}:${i+1}: ${m[1]} literal must use ores-trace-*`);if(/\b(?:const|let|var)\s+\w*trace\w*\s*=\s*(['"`])ores-trace-[^'"`]+\1/i.test(l))bad.push(`${f}:${i+1}: keep static ores-trace-* inline`);const r=l.match(/\bconst\s+routineId\s*=\s*(['"`])([^'"`]+)\1/);if(r&&!/^ores-routine-[A-Za-z0-9_-]{12,64}$/.test(r[2]))bad.push(`${f}:${i+1}: routineId must use ores-routine-*`);});}
          if(bad.length){console.error(bad.join('\n'));process.exit(1)}
          NODE
