name: certify Shared Auth lib-core PR 33

on:
  pull_request:
    paths:
      - '.github/workflows/certify-shared-auth-lib-core-pr-33.yml'
      - 'docs/shared-auth-lib-core-pr-33-certification.md'
      - 'candidates/shared-auth-lib-core-pr33/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify exact mirrored product blobs
        shell: bash
        run: |
          set -euo pipefail
          root=candidates/shared-auth-lib-core-pr33
          test "$(git hash-object "$root/contracts/source-lock.toml")" = "2cb363a18110a66c90e6231774ed62ac28312ff6"
          test "$(git hash-object "$root/.zpkg.toml")" = "41d5f1a27bd0f1db30d5df51c02bdf31c34449c8"
          test "$(git hash-object "$root/server/README.md")" = "bb80e417ce1c9fd7738dc40b46ebb8954a37b514"
          test "$(git hash-object "$root/.shared-auth.toml")" = "d252be23957d241c7ad8f9c4f25b2718402275ad"
          test "$(git hash-object "$root/SOURCE-Cargo.toml")" = "8c98622313f813d003705e5c2f3a76345bc6c297"
          test "$(git hash-object "$root/core-boundary.toml")" = "f94755b86a7532c5777a215483182d021c282ab6"
          test "$(git hash-object "$root/src/auth_decision.rs")" = "2c265afd10e3b07e1ad36b0ac3437276d0db660b"
          test "$(git hash-object "$root/src/auth_topology.rs")" = "8e7fc891f985e834fdf56cd3cbc9dac8bce7f65c"
          test "$(git hash-object "$root/src/central_config.rs")" = "99177b61e3deb461eb0576fded26dcd64218e5b5"
          test "$(git hash-object "$root/src/config.rs")" = "1796cc1bb4312c6f770148b471303df3ef286795"
          test "$(git hash-object "$root/src/config_discovery.rs")" = "24a16cca9bf8897658c98b3b81696f360380d540"
          test "$(git hash-object "$root/src/consumer_policy.rs")" = "1abe657aa93b282ee380fc33d6191367c453c5a2"
          test "$(git hash-object "$root/src/lib.rs")" = "38ea4fbe0cf637fb3fe249116a9d103d6b1da97b"
          test "$(git hash-object "$root/src/proximity.rs")" = "08e99abde28f45406bd9dc6d7d808d2d94b6c4bd"
          test "$(git hash-object "$root/src/shared_auth_config.rs")" = "59d4413d48dcb1ab6fce270bd1da05b84e61d12b"

      - name: Install source-declared MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Format, test, and strict-lint exact source files
        working-directory: candidates/shared-auth-lib-core-pr33
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.88.0 --check src/consumer_policy.rs
          rustfmt +1.88.0 --check --config skip_children=true src/lib.rs
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Run exact lib-core boundary guard
        working-directory: candidates/shared-auth-lib-core-pr33
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             https://raw.githubusercontent.com/zed-pkg/zed-lib-core/8c62c5b67d2e7919054a173b3295dcc0dd64f307/tools/core-contract-guard.rs             --output /tmp/core-contract-guard.rs
          echo '67f0e81ebe0230a69ae145776cb148797715158e8a6bd61d8d34dcf398a5f06a  /tmp/core-contract-guard.rs' | sha256sum --check --strict
          rustc +1.88.0 --edition=2021 --test /tmp/core-contract-guard.rs -o /tmp/core-contract-guard-tests
          /tmp/core-contract-guard-tests
          rustc +1.88.0 --edition=2021 -D warnings /tmp/core-contract-guard.rs -o /tmp/core-contract-guard
          /tmp/core-contract-guard --kind lib-core
          ! grep -RInE 'sea_orm|sea-orm|diesel|sqlx|DatabaseConnection|DATABASE_URL|std::env::(var|vars)|process\.env|Deno\.env|Bun\.env|Platform\.environment|System\.getenv|os\.Getenv' src
