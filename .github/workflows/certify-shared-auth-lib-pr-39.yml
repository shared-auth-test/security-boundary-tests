name: certify Shared Auth lib PR 39

on:
  pull_request:
    paths:
      - 'candidates/shared-auth-lib-pr39/**'
      - '.github/workflows/certify-shared-auth-lib-pr-39.yml'
      - 'docs/shared-auth-lib-pr-39-certification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-proof-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Verify exact product blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object candidates/shared-auth-lib-pr39/src/proof_policy.rs)" = "f08baca139f03b9c6f58a043a3440a5db1d31ac7"
          test "$(git hash-object candidates/shared-auth-lib-pr39/src/provider_adapter.rs)" = "867c986405c787ef0452cd61a5cf3f2e3bc6db25"

      - name: Format, lint, and test
        shell: bash
        run: |
          set -euo pipefail
          manifest=candidates/shared-auth-lib-pr39/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"
