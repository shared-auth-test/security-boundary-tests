# HAProxy 3.2 with Lua/HTTPClient. Run with runtime-auth as working directory.
global
    lua-load proxies/haproxy-auth.lua
    lua.session-timeout 2s
defaults
    mode http
    timeout connect 200ms
    timeout client 5s
    timeout server 2s
    timeout http-request 2s
    retries 0
frontend admission
    bind 127.0.0.1:9080
    http-request set-var(txn.auth_status) int(503)
    http-request lua.shared_auth_check
    http-request deny deny_status 401 if { var(txn.auth_status) -m int 401 }
    http-request deny deny_status 403 if { var(txn.auth_status) -m int 403 }
    http-request deny deny_status 503 unless { var(txn.auth_status) -m int 200 }
    default_backend application
backend application
    server local 127.0.0.1:9082
