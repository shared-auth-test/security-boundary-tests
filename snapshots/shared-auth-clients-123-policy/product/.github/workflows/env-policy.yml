name: encrypted environment policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and test the SOPS policy validator
        run: |
          cargo fmt --manifest-path tools/sops-release-policy/Cargo.toml -- --check
          cargo test --manifest-path tools/sops-release-policy/Cargo.toml
      - name: Validate encrypted environment policy
        run: bash scripts/check-env-policy.sh
