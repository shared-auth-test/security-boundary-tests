name: certify Shared Auth lib-core PR 33

on:
  pull_request:
    paths:
      - '.github/workflows/certify-shared-auth-lib-core-pr-33.yml'
      - 'docs/shared-auth-lib-core-pr-33-certification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Fetch exact public product head
        shell: bash
        run: |
          set -euo pipefail
          sha=a44b803fb8c063da8c27e2a14603a850d2711c12
          git init product
          git -C product remote add origin https://github.com/shared-auth/shared-auth-lib-core.git
          git -C product fetch --depth=1 origin "$sha"
          git -C product checkout --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$sha"
          test "$(git -C product hash-object src/consumer_policy.rs)" = "0f9b6e988e2f6d543bbaa0fbb4b7fa0781610286"
          test "$(git -C product hash-object src/lib.rs)" = "e2b5297040529c724c4e90d962697720570c661e"

      - name: Install source-declared MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Format, test, and lint exact product head
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Run exact lib-core boundary guard
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             https://raw.githubusercontent.com/zed-pkg/zed-lib-core/8c62c5b67d2e7919054a173b3295dcc0dd64f307/tools/core-contract-guard.rs             --output /tmp/core-contract-guard.rs
          echo '67f0e81ebe0230a69ae145776cb148797715158e8a6bd61d8d34dcf398a5f06a  /tmp/core-contract-guard.rs' | sha256sum --check --strict
          rustc +1.88.0 --edition=2021 --test /tmp/core-contract-guard.rs -o /tmp/core-contract-guard-tests
          /tmp/core-contract-guard-tests
          rustc +1.88.0 --edition=2021 -D warnings /tmp/core-contract-guard.rs -o /tmp/core-contract-guard
          /tmp/core-contract-guard --kind lib-core
          ! grep -RInE 'sea_orm|sea-orm|diesel|sqlx|DatabaseConnection|DATABASE_URL|std::env::(var|vars)|process\.env|Deno\.env|Bun\.env|Platform\.environment|System\.getenv|os\.Getenv' src client edge isomorph
