name: generated-contract

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Runtime generated contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned jsonschema runtime
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          jsonschema==4.25.1 referencing==0.36.2 rpds-py==0.27.0
      - name: Check generated policy, freeze bits, and JSON Schema runtime
        run: python3 scripts/check-generated-contract.py --freeze --require-readonly
