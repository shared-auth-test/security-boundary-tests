name: certify Shared Auth lib PR 39

on:
  pull_request:
    paths:
      - 'candidates/shared-auth-lib-pr39/**'
      - 'candidates/shared-auth-lib-pr39-full/**'
      - '.github/workflows/certify-shared-auth-lib-pr-39.yml'
      - 'docs/shared-auth-lib-pr-39-certification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-proof-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Verify exact product blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object candidates/shared-auth-lib-pr39/src/proof_policy.rs)" = "408c7f18e16ae8ddcb2ec17ab800924271b559c6"
          test "$(git hash-object candidates/shared-auth-lib-pr39/src/provider_adapter.rs)" = "867c986405c787ef0452cd61a5cf3f2e3bc6db25"

      - name: Format, lint, and test
        shell: bash
        run: |
          set -euo pipefail
          manifest=candidates/shared-auth-lib-pr39/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"



  full-product-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact mirrored candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify complete Rust package slice
        shell: bash
        run: |
          set -euo pipefail
          root=candidates/shared-auth-lib-pr39-full
          grep -Fx '# product_head=4b0792a6685fa27188b4ed52d89c580d65015bb5' "$root/SOURCE-GIT-BLOBS.txt"
          grep -v '^#' "$root/SOURCE-GIT-BLOBS.txt" | while read -r expected path; do
            [ -n "$expected" ] || continue
            test "$(git hash-object "$root/$path")" = "$expected"
          done

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run source-owned locked Rust gates
        shell: bash
        working-directory: candidates/shared-auth-lib-pr39-full/langs/rust
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
