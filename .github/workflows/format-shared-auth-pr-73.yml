name: format certified Rust SOPS validator

on:
  push:
    branches:
      - certify/shared-auth-pr-73-rust-sops
    paths:
      - '.github/workflows/format-shared-auth-pr-73.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: certify/shared-auth-pr-73-rust-sops
          persist-credentials: true
          fetch-depth: 0

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Apply canonical formatting and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/sops-release-policy/Cargo.toml
          cargo fmt --manifest-path tools/sops-release-policy/Cargo.toml -- --check
          rm .github/workflows/format-shared-auth-pr-73.yml
          git diff --check

      - name: Commit exact formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sops-release-policy/src/main.rs
          git rm .github/workflows/format-shared-auth-pr-73.yml
          git diff --cached --check
          git commit -m 'style: apply canonical Rust formatting to SOPS validator'
          git push origin HEAD:certify/shared-auth-pr-73-rust-sops
