name: Deep test suite

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: ''
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Run deterministic deep suite
        env:
          PYTHONPATH: src
          DEEP_TEST_SEEDS: '0-49'
        run: python -m unittest discover -s tests -v


  certify-workload-foundation:
    if: github.event_name == 'pull_request' && github.head_ref == 'certify-shared-auth-workload-215-236-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_workload
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_workload
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_workload"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PRODUCT_SHA: a1e06aa5f99df226f5d81e689f64fc24b208bac9
      AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_workload@127.0.0.1:5432/shared_auth_workload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shared-auth/shared-auth-server.rs
          ref: a1e06aa5f99df226f5d81e689f64fc24b208bac9
          path: product
          persist-credentials: false
      - run: test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: SQL and Rust exact-head contract
        working-directory: product
        run: |
          set -euo pipefail
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/workload-identities.sql
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/workload-identities.sql
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workload_identity_db.sql
          cargo fmt --all -- --check
          cargo test --locked workload::
          cargo test --locked workload_token::
          cargo test --locked --test workload_identity_contract
          cargo clippy --all-targets --locked -- -D warnings

  certify-workload-signer:
    if: github.event_name == 'pull_request' && github.head_ref == 'certify-shared-auth-workload-215-236-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_workload
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_workload
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_workload"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PRODUCT_SHA: 438a54fff6367fed00144f0526e28d2a7a94740c
      AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_workload@127.0.0.1:5432/shared_auth_workload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shared-auth/shared-auth-server.rs
          ref: 438a54fff6367fed00144f0526e28d2a7a94740c
          path: product
          persist-credentials: false
      - run: test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: SQL and signer exact-head contract
        working-directory: product
        run: |
          set -euo pipefail
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/workload-identities.sql
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/workload-identities.sql
          psql "$AUTH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/workload_identity_db.sql
          cargo fmt --all -- --check
          cargo test --locked workload::
          cargo test --locked workload_token::
          cargo test --locked token::minter::tests::workload_
          cargo test --locked --test workload_identity_contract
          cargo clippy --all-targets --locked -- -D warnings
