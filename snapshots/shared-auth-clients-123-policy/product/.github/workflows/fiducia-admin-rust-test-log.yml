name: Fiducia Admin Rust test diagnostic

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  rust-test-log:
    if: github.head_ref == 'agent/temp-fiducia-admin-lockfile-gen-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiducia_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiducia_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fiducia_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-admin.rs
          ref: fcd25d4b4c514a37a1a15a5326c125147fe4ac3a
          path: repo
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: 0ad257b6708117dcc3643a9fd15b0f92ca394c1f
          path: fiducia-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-sync
          ref: e4cb47c9582e11de62c0f19ce3511d3b7c1cce04
          path: fiducia-sync
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: shared-auth/shared-auth-clients
          run-id: 30778199697
          name: fiducia-admin-validated-patch-v2
          path: generated-patch
      - name: Overlay the checksum-verified generated patch
        run: |
          set -euo pipefail
          cp -a generated-patch/. repo/
          sha256sum repo/Cargo.lock
          grep -q 'name = "fiducia-shared-auth-guard"' repo/Cargo.lock
          grep -q 'name = "jsonwebtoken"' repo/Cargo.lock
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - id: rust-tests
        name: Capture Rust test output
        working-directory: repo
        run: |
          set +e
          set -o pipefail
          cargo test --locked --all-targets --all-features 2>&1 | tee ../rust-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused Rust test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-admin-rust-tests
          path: rust-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Propagate Rust test result
        run: exit "${{ steps.rust-tests.outputs.exit_code }}"
