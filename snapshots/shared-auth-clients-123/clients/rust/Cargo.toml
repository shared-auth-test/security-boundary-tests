[package]
name = "shared-auth-client"
version = "0.1.0"
edition = "2021"
description = "Thin typed client for the shared-auth server HTTP API (exchange, introspect, verify, jwks)."
license = "UNLICENSED"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
